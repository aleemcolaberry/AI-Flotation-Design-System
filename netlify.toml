# Netlify — static site, no build step (single self-contained index.html).
[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
